embedding_model:
  provider: "huggingface"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  dimensions: 384
  device: "cpu"

reranking_model:
  provider: "cross-encoder"
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

llm:
  default_provider: "openai"
  model_name: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 2048